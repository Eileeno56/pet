name: Validación del código
on:
  push:
    branches: [main, 'codex/**', 'feat/**', 'fix/**', 'docs/**', 'test/**', 'chore/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  beta-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/scripts/lock-beta.test.cjs
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/create-ci-firebase-config.cjs
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze lib test
      - run: flutter test
      - run: flutter pub get --enforce-lockfile
        working-directory: petreminder_admin
      - run: flutter analyze lib test
        working-directory: petreminder_admin
      - run: flutter test
        working-directory: petreminder_admin
